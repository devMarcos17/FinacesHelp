<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas concluídas | Finance Help</title>

    <style>
        :root {
            --ink: #12263a;
            --ink-soft: #5b6b7c;
            --bg: #eef2f6;
            --surface: #ffffff;
            --line: #dce3ea;
            --brand: #163a59;
            --brand-2: #285b82;
            --in: #0f7b4f;
            --in-bg: #e5f4ec;
            --radius: 16px;
            --font: Arial, Helvetica, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible { outline: 3px solid #63b3ed; outline-offset: 2px; }

        /* ---------- Navbar ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(18px, 4vw, 48px);
            background: var(--brand);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 6px 18px rgba(18, 38, 58, 0.18);
        }

        .logo { color: #fff; font-size: 20px; font-weight: bold; letter-spacing: 0.2px; }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        .nav-link {
            color: #c9d6e2;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .nav-link:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-link.active { background: rgba(255, 255, 255, 0.16); color: #fff; }

        /* ---------- Conteúdo ---------- */
        .completed-goals-section {
            width: 92%;
            max-width: 1200px;
            margin: 36px auto 60px;
        }

        .goals-header { margin-bottom: 24px; }
        .goals-header h2 { color: var(--ink); font-size: clamp(24px, 4vw, 30px); margin-bottom: 6px; }
        .goals-header p { color: var(--ink-soft); font-size: 14px; }

        /* ---------- Lista (gerada pelo JS) ---------- */
        #result-finished {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        #result-finished:empty::before {
            content: "Você ainda não concluiu nenhum objetivo. Quando bater uma meta, ela aparece aqui.";
            grid-column: 1 / -1;
            padding: 28px;
            background: var(--surface);
            border: 1px dashed #c3cfda;
            border-radius: var(--radius);
            color: var(--ink-soft);
            font-size: 14px;
            text-align: center;
        }

        .goal-card.completed-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }

        .badge-completed {
            align-self: flex-start;
            background: var(--in-bg);
            color: var(--in);
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 999px;
            margin-bottom: 14px;
        }

        .goal-card p {
            width: 100%;
            color: var(--ink-soft);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }

        .goal-card p strong { color: var(--ink); }
        .goal-card p strong:first-child { font-size: 17px; }

        .goal-card img {
            width: 100%;
            max-width: none;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            margin: 4px 0 12px;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background-color: var(--in) !important;
        }

        /* Percentual / última linha do card */
        .goal-card p:last-child {
            font-size: 13px;
            font-weight: bold;
            color: var(--in);
            text-align: right;
            margin-bottom: 0;
        }

        /* ---------- Celular ---------- */
        @media (max-width: 640px) {
            .navbar { height: auto; padding: 12px 18px; flex-wrap: wrap; gap: 10px; }
            .nav-links { width: 100%; flex-wrap: wrap; justify-content: center; }
            .completed-goals-section { margin-top: 28px; }
            #result-finished { grid-template-columns: 1fr; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Finance Help</div>
        <div class="nav-links">
            <a class="nav-link" href="dashboard.html">Início</a>
            <a class="nav-link" href="transactions.html">Transações</a>
            <a class="nav-link active" href="goal.html" aria-current="page">Objetivos</a>
            <a class="nav-link" href="investiments.html">Investimentos</a>
        </div>
    </nav>

    <section class="completed-goals-section">
        <div class="goals-header">
            <h2>Metas concluídas</h2>
            <p>Parabéns! Veja aqui todas as conquistas que você alcançou.</p>
        </div>

        <!-- Metas geradas pelo JavaScript -->
        <div id="result-finished"></div>
    </section>

    <script src="../script/scriptGoalCompleted.js"></script>

</body>

</html>
