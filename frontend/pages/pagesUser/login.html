<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           RESET & BASE
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #acadae;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* =========================================
           CARD DE LOGIN
        ========================================= */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 51, 68, 0.12);
            border: 1px solid #d9e0e7;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #163a59, #285b82);
            padding: 35px 30px;
            color: #ffffff;
            text-align: center;
        }

        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
        }

        .login-header p {
            font-size: 13px;
            color: #dbe7f0;
            margin-top: 5px;
        }

        /* =========================================
           FORMULÁRIO & INPUTS
        ========================================= */
        #formLogin {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #formLogin label {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        #formLogin input[type="text"],
        #formLogin input[type="password"] {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #334155;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        #formLogin input:focus {
            border-color: #285b82;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(40, 91, 130, 0.15);
        }

        /* =========================================
           BOTÃO & LINKS
        ========================================= */
        #formLogin input[type="submit"] {
            height: 48px;
            background: #285b82;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        #formLogin input[type="submit"]:hover {
            background: #163a59;
            transform: translateY(-2px);
        }

        #formLogin input[type="submit"]:active {
            transform: translateY(0);
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 8px;
            color: #285b82;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #163a59;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Login</h2>
        </div>

        <form action="" id="formLogin">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="text" name="email" id="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <input type="submit" value="Entrar">
            
            <a href="forgotPassword.html" class="forgot-link">Esqueceu sua senha?</a>
        </form>
    </div>

    <script src="../script/scriptLogin.js"></script>
</body>
</html>
