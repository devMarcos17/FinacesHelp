<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    background-color: #f4f6f9;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

#investimentForm {
    background-color: #ffffff;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

#investimentForm label {
    font-size: 0.875rem;
    font-weight: 600;
    color: #4a5568;
    margin-bottom: -8px;
}

#investimentForm input[type="text"],
#investimentForm input[type="number"] {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 1rem;
    color: #1a202c;
    background-color: #f8fafc;
    transition: all 0.2s ease-in-out;
    outline: none;
}

#investimentForm input[type="text"]:focus,
#investimentForm input[type="number"]:focus {
    border-color: #3182ce;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
}

#investimentForm button[type="submit"] {
    margin-top: 8px;
    padding: 12px 20px;
    background-color: #2b6cb0;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
}

#investimentForm button[type="submit"]:hover {
    background-color: #2c5282;
}

#investimentForm button[type="submit"]:active {
    transform: scale(0.98);
}
    </style>
    <form id="investimentForm">

        <input type="hidden" id="id" name="id">

        <label for="title">Título</label>
        <input type="text" id="title" name="title">

        <label for="amount_invested">Valor investido</label>

        <button type="submit">Salvar</button>

    </form>

    <script src="../script/scriptInvestiment.js"></script>
    <script src="../script/scriptUpdateInvestiment.js"></script>

</body>

</html>
