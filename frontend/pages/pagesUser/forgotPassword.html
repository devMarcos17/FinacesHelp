<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        #formForgot {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        #formForgot h2 {
            margin-bottom: 25px;
            text-align: center;
            color: #333333;
        }

        #formForgot input[type="email"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        #formForgot input[type="email"]:focus {
            border-color: #007bff;
        }

        #formForgot input[type="submit"] {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        #formForgot input[type="submit"]:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <form id="formForgot">
        <h2>Recuperar Senha</h2>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail cadastrado"
            required
        >

        <input type="submit" value="Enviar">
    </form>

    <script src="../script/scriptForgot.js"></script>

</body>

</html>
