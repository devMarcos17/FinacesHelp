<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetivos | Finance Help</title>

    <style>
        :root {
            --ink: #12263a;
            --ink-soft: #5b6b7c;
            --ink-faint: #8a98a8;
            --bg: #eef2f6;
            --surface: #ffffff;
            --line: #dce3ea;
            --brand: #163a59;
            --brand-2: #285b82;
            --in: #2e7d32;
            --in-dark: #1b5e20;
            --warn: #e67e22;
            --warn-dark: #d35400;
            --out: #c0392b;
            --out-dark: #a02c20;
            --radius: 16px;
            --font: Arial, Helvetica, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible { outline: 3px solid #63b3ed; outline-offset: 2px; }

        /* ---------- Navbar ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(18px, 4vw, 48px);
            background: var(--brand);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 6px 18px rgba(18, 38, 58, 0.18);
        }

        .logo { color: #fff; font-size: 20px; font-weight: bold; letter-spacing: 0.2px; }

        .nav-links { display: flex; align-items: center; gap: 4px; }

        .nav-link {
            color: #c9d6e2;
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, color 0.2s;
        }

        .nav-link:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        /* ---------- Layout ---------- */
        .container {
            width: 92%;
            max-width: 1200px;
            margin: 36px auto 60px;
        }

        /* ---------- Formulário ---------- */
        .create-goal {
            width: 100%;
            max-width: 760px;
            margin: 0 auto 48px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 28px;
        }

        .create-goal h2 { color: var(--ink); font-size: 20px; margin-bottom: 4px; }
        .create-goal .subtitle { color: var(--ink-soft); font-size: 14px; margin-bottom: 22px; }

        #formGoal {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 18px;
        }

        #formGoal > div { display: flex; flex-direction: column; gap: 6px; }

        /* Descrição e imagem ocupam a linha toda */
        #formGoal > div:nth-child(3),
        #formGoal > div:nth-child(5) { grid-column: 1 / -1; }

        #formGoal label { color: var(--ink-soft); font-size: 13px; font-weight: bold; }

        #formGoal input,
        #formGoal textarea {
            width: 100%;
            border: 1px solid #ccd6df;
            border-radius: 10px;
            background: #fff;
            color: var(--ink);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #formGoal input { height: 42px; padding: 0 12px; }
        #formGoal textarea { min-height: 90px; padding: 10px 12px; resize: vertical; }

        #formGoal input::placeholder,
        #formGoal textarea::placeholder { color: #9aa8b5; }

        #formGoal input:focus,
        #formGoal textarea:focus {
            border-color: var(--brand-2);
            box-shadow: 0 0 0 3px rgba(40, 91, 130, 0.15);
        }

        #formGoal input[type="file"] { height: auto; padding: 8px; cursor: pointer; background: #f8fafc; }

        #formGoal input[type="file"]::file-selector-button {
            margin-right: 12px;
            padding: 7px 14px;
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        #formGoal button {
            grid-column: 1 / -1;
            height: 44px;
            border: 0;
            border-radius: 10px;
            background: var(--brand);
            color: #fff;
            font-family: var(--font);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #formGoal button:hover { background: var(--brand-2); }

        #mensagem { margin-top: 12px; color: var(--brand-2); font-size: 14px; font-weight: bold; text-align: center; }
        #mensagem:empty { display: none; }

        /* ---------- Cabeçalho da lista ---------- */
        .goals-header { margin-bottom: 20px; }
        .goals-header h2 { color: var(--ink); font-size: 24px; margin-bottom: 6px; }
        .goals-header p { color: var(--ink-soft); font-size: 14px; }

        /* ---------- Lista de objetivos (gerada pelo JS) ---------- */
        #resultado {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        #resultado > div {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #resultado p {
            color: var(--ink-soft);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        #resultado p strong { color: var(--ink); }
        #resultado p strong:first-child { font-size: 17px; }

        #resultado img {
            width: 100%;
            max-width: none;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            margin: 4px 0 12px;
        }

        #resultado hr { display: none; }

        /* Barra de progresso */
        .progress-container {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin: 6px 0 12px;
        }

        .progress-bar {
            height: 100%;
            background: var(--in);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* Depositar / Retirar */
        .deposit-form,
        .devolution-form {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .deposit-form label,
        .devolution-form label {
            width: 100%;
            font-size: 13px;
            font-weight: bold;
            color: var(--ink-soft);
        }

        .deposit-form input,
        .devolution-form input {
            flex: 1;
            min-width: 0;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #ccd6df;
            border-radius: 10px;
            outline: none;
            font-family: var(--font);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .deposit-form input:focus,
        .devolution-form input:focus {
            border-color: var(--brand-2);
            box-shadow: 0 0 0 3px rgba(40, 91, 130, 0.15);
        }

        .deposit-form button,
        #resultado .deposit-form button,
        .devolution-form button,
        #resultado .devolution-form button {
            height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .deposit-form button,
        #resultado .deposit-form button { background: var(--in); }
        .deposit-form button:hover,
        #resultado .deposit-form button:hover { background: var(--in-dark); }

        .devolution-form button,
        #resultado .devolution-form button { background: var(--warn); }
        .devolution-form button:hover,
        #resultado .devolution-form button:hover { background: var(--warn-dark); }

        /* Atualizar / Excluir */
        #resultado button {
            height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #resultado button[onclick*="update.html"] { background: var(--brand-2); margin-top: 14px; }
        #resultado button[onclick*="update.html"]:hover { background: var(--brand); }

        #resultado button[onclick*="deleteGoal"] { background: var(--out); margin-top: 14px; margin-left: 6px; }
        #resultado button[onclick*="deleteGoal"]:hover { background: var(--out-dark); }

        /* ---------- Celular ---------- */
        @media (max-width: 700px) {
            .navbar { height: auto; padding: 12px 18px; flex-wrap: wrap; gap: 10px; }
            .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
            .create-goal { padding: 22px; }
            #formGoal { grid-template-columns: 1fr; }
            #formGoal > div:nth-child(3),
            #formGoal > div:nth-child(5) { grid-column: auto; }
            #resultado { grid-template-columns: 1fr; }
            #resultado button[onclick*="update.html"],
            #resultado button[onclick*="deleteGoal"] { width: 100%; margin-left: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Finance Help</div>
        <div class="nav-links">
            <a href="goalComplete.html" class="nav-link">Objetivos completados</a>
            <a href="index.html" class="nav-link">Voltar</a>
        </div>
    </nav>

    <main class="container">

        <!-- Criar objetivo -->
        <section class="create-goal">
            <h2>Criar novo objetivo</h2>
            <p class="subtitle">Defina quanto você quer juntar e até quando.</p>

            <form id="formGoal" enctype="multipart/form-data">

                <div>
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" placeholder="Ex: Comprar uma casa" required>
                </div>

                <div>
                    <label for="target_year">Ano da meta</label>
                    <input type="number" id="target_year" name="target_year" placeholder="Ex: 2026" required>
                </div>

                <div>
                    <label for="description">Descrição</label>
                    <textarea id="description" name="description" placeholder="Descreva seu objetivo..."></textarea>
                </div>

                <div>
                    <label for="target_date">Data limite</label>
                    <input type="date" id="target_date" name="target_date">
                </div>

                <div>
                    <label for="image_path">Imagem</label>
                    <input type="file" id="image_path" name="image_path">
                </div>

                <div>
                    <label for="target_amount">Valor do objetivo</label>
                    <input type="number" id="target_amount" name="target_amount" placeholder="Ex: 25000.00" step="0.01" min="0" required>
                </div>

                <button type="submit">Criar objetivo</button>

            </form>

            <p id="mensagem"></p>
        </section>

        <!-- Meus objetivos -->
        <section class="goals-section">
            <div class="goals-header">
                <h2>Meus objetivos</h2>
                <p>Acompanhe suas metas e mantenha seus objetivos financeiros em dia.</p>
            </div>

            <!-- Objetivos gerados pelo JavaScript -->
            <div id="resultado"></div>
        </section>

    </main>
    <script src="../js/config.js"></script>
    <script src="../script/scriptGoal.js"></script>
    <script src="../script/scriptDeposit.js"></script>
    <script src="../script/scriptDevolution.js"></script>

</body>

</html>
