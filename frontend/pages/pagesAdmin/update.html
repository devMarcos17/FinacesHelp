<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #edf1f5;
            color: #243447;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-form {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #d9e0e7;
            border-top: 6px solid #285b82;
            box-shadow: 0 6px 18px rgba(31, 51, 68, 0.12);
        }

        .card-form h2 {
            color: #193e5c;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid #d9e0e7;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #193e5c;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #243447;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #285b82;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(40, 91, 130, 0.15);
        }

        input[type="submit"] {
            width: 100%;
            height: 44px;
            background: #285b82;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.2s;
        }

        input[type="submit"]:hover {
            background: #163a59;
            transform: translateY(-2px);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #536577;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #193e5c;
        }
    </style>
</head>
<body>

    <main class="card-form">
        <h2>Editar Usuário</h2>

        <form action="" id="updateForm">
            <input type="hidden" name="id" id="id">

            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Digite o novo nome">
            </div>

            <div class="form-group">
                <label for="password">Nova Senha</label>
                <input type="password" name="password" id="password" placeholder="Digite a nova senha">
            </div>

            <input type="submit" value="Confirmar">
        </form>

        <a href="adm.html" class="btn-back">← Voltar para o painel</a>
    </main>

    <script src="../scriptAdm/scriptUpdate.js"></script>
</body>
</html>
