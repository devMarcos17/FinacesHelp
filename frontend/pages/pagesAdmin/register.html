<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           RESET & BASE
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #edf1f5;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* =========================================
           CONTAINER DO FORMULÁRIO
        ========================================= */
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 51, 68, 0.12);
            border: 1px solid #d9e0e7;
            overflow: hidden;
        }

        .register-header {
            background: linear-gradient(135deg, #163a59, #285b82);
            padding: 30px;
            color: #ffffff;
            text-align: center;
        }

        .register-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .register-header p {
            font-size: 13px;
            color: #dbe7f0;
            margin-top: 5px;
        }

        /* =========================================
           CAMPOS DO FORMULÁRIO
        ========================================= */
        #form {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        #form input[type="text"],
        #form input[type="email"],
        #form input[type="password"],
        #form input[type="date"],
        #form select {
            width: 100%;
            height: 45px;
            padding: 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            color: #334155;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Destaque ao clicar no campo */
        #form input:focus,
        #form select:focus {
            border-color: #285b82;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(40, 91, 130, 0.15);
        }

        /* =========================================
           BOTÕES
        ========================================= */
        #btnRegister {
            height: 48px;
            background: #285b82;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        #btnRegister:hover {
            background: #163a59;
            transform: translateY(-2px);
        }

        #btnRegister:active {
            transform: translateY(0);
        }

        .btn-back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .btn-back-link:hover {
            color: #163a59;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <div class="register-header">
            <h2>Novo Usuário</h2>
            <p>Preencha os dados abaixo para cadastrar</p>
        </div>

        <form action="" id="form">
            <div class="form-group">
                <label for="name">Nome Completo</label>
                <input type="text" name="name" placeholder="Digite o nome" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" placeholder="Digite o e-mail" id="email" required>
            </div>

            <div class="form-group">
                <label for="role">Nível de Acesso</label>
                <select name="role" id="role">
                    <option value="admin">Administrador</option>
                    <option value="user">Usuário</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" placeholder="Digite a senha" id="password" required>
            </div>

            <div class="form-group">
                <label for="phone">Telefone</label>
                <input type="text" name="phone" placeholder="(00) 00000-0000" id="phone">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" name="cpf" placeholder="000.000.000-00" id="cpf">
            </div>

            <div class="form-group">
                <label for="date_of_birt">Data de Nascimento</label>
                <input type="date" name="date_of_birt" id="date_of_birt">
            </div>

            <input type="submit" value="Cadastrar" id="btnRegister">

            <a href="adm.html" class="btn-back-link">← Voltar ao Painel Admin</a>
        </form>
    </div>

    <script src="../scriptAdm/scriptRegister.js"></script>
</body>

</html>
