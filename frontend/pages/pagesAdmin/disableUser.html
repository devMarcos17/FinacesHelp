<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários Inativos</title>
    <!-- Fonte Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           RESET & BASE
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #edf1f5;
            color: #1e293b;
            min-height: 100vh;
        }

        /* =========================================
           CABEÇALHO & NAVEGAÇÃO
        ========================================= */
        .header-container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #163a59, #285b82);
            padding: 35px 40px;
            border-radius: 16px;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(31, 51, 68, 0.15);
        }

        .header-container h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* =========================================
           SEÇÃO DA LISTA
        ========================================= */
        .content-section {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 50px;
            background: #f8fafc;
            border: 1px solid #d9e0e7;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 6px 18px rgba(31, 51, 68, 0.08);
        }

        #users {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* =========================================
           CARD DE USUÁRIO INATIVO
        ========================================= */
        #users > .user-card,
        #users > div {
            background: #ffffff;
            border: 1px solid #d9e0e7;
            border-left: 6px solid #d00000; /* Detalhe vermelho indicando "Inativo" */
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 14px rgba(31, 51, 68, 0.06);
            transition: transform 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #users > .user-card:hover,
        #users > div:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(31, 51, 68, 0.12);
        }

        #users p {
            color: #475569;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        #users strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* Status Inativo em Destaque */
        .status-inativo {
            color: #c62828;
            font-weight: 700;
            background-color: #ffebee;
            padding: 3px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        /* Botão Reativar/Ativar (Verde) se tiver no card */
        #users button, .btn-active {
            background-color: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        #users button:hover, .btn-active:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }

        /* =========================================
           ESTADO VAZIO
        ========================================= */
        #users:empty::before {
            content: "Nenhum usuário inativo encontrado.";
            display: block;
            grid-column: 1 / -1;
            padding: 40px;
            text-align: center;
            color: #64748b;
            font-size: 15px;
            background: #ffffff;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
        }

        /* =========================================
           RESPONSIVO
        ========================================= */
        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
                padding: 25px;
            }
            .header-container h1 {
                font-size: 24px;
            }
            #users {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header-container">
        <h1>Usuários Inativos</h1>
        <a href="adm.html" class="btn-back">← Voltar ao Painel</a>
    </header>

    <main class="content-section">
        <div id="users">
            <!-- Os usuários serão exibidos aqui pelo script -->
        </div>
    </main>

    <script src="../scriptAdm/scriptActive.js"></script>

</body>
</html>
