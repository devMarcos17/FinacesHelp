<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #193e5c;
            --blue: #285b82;
            --blue-dark: #163a59;
            --green: #2e7d32;
            --red: #d00000;
            --gray: #6c757d;
            --bg: #eef2f6;
            --surface: #fff;
            --line: #dbe3ea;
            --text: #0f172a;
            --muted: #536577;
            --radius: 14px;
            --shadow: 0 4px 14px rgba(25, 62, 92, .08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        :focus-visible { outline: 3px solid rgba(40, 91, 130, .4); outline-offset: 2px; }

        .welcome, .metrics-grid, .search-container, .list {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 24px;
        }

        /* Navegação */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            gap: 8px;
            padding: 12px 5%;
            background: var(--navy);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
            margin-bottom: 28px;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background .2s;
        }

        .navbar a:hover { background: rgba(255, 255, 255, .15); }

        /* Boas-vindas */
        .welcome {
            position: relative;
            overflow: hidden;
            padding: 32px;
            border-radius: var(--radius);
            color: #fff;
            background: linear-gradient(135deg, var(--blue-dark), var(--blue));
            box-shadow: 0 8px 22px rgba(25, 62, 92, .22);
        }

        .welcome::after {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            right: -60px;
            top: -90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .07);
        }

        .welcome span { display: block; font-size: 14px; color: #cfe0ee; }
        .welcome h1 { font-size: clamp(22px, 4vw, 32px); font-weight: 700; }

        /* Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .metric-card {
            padding: 20px 22px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-bottom: 4px solid var(--navy);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .metric-card h3 { font-size: 13px; font-weight: 500; color: #64748b; }
        .metric-card p { font-size: 32px; font-weight: 700; line-height: 1.2; margin-top: 4px; }

        .active-border { border-bottom-color: var(--green); }
        .inactive-border { border-bottom-color: var(--red); }
        .admin-border { border-bottom-color: var(--blue); }

        /* Pesquisa */
        #search-input {
            width: 100%;
            padding: 14px 20px;
            font: 400 14px 'Poppins', sans-serif;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: var(--shadow);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        #search-input::placeholder { color: #94a3b8; }
        #search-input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(40, 91, 130, .15); }

        /* Seções de listagem */
        .list {
            padding: 28px;
            background: #f8fafc;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .list h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .list-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--line);
        }

        .list-header h2 { margin: 0; padding: 0; border: 0; }

        .list-header span {
            font-size: 12px;
            font-weight: 600;
            color: var(--blue);
            background: #e3edf5;
            padding: 4px 12px;
            border-radius: 999px;
        }

        /* Botão PDF */
        .btn-pdf {
            margin-bottom: 20px;
            padding: 11px 20px;
            font: 600 13px 'Poppins', sans-serif;
            color: #fff;
            background: var(--navy);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }

        .btn-pdf:hover { background: var(--blue); transform: translateY(-1px); }

        /* Grids e cards (as 4 listas compartilham o mesmo estilo) */
        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) > * {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 5px solid var(--blue);
            border-radius: 12px;
            box-shadow: var(--shadow);
            transition: transform .2s, box-shadow .2s;
        }

        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) > *:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(25, 62, 92, .14);
        }

        #list-filterUsers > * { border-left-color: var(--green); }

        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) p {
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 1px solid #e8edf2;
            word-break: break-word;
        }

        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) p:last-of-type {
            border-bottom: 0;
        }

        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) strong {
            color: var(--text);
            font-weight: 600;
        }

        /* Botões de ação */
        .user-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

        :is(#list-users, #list-filterUsers) button {
            flex: 1 1 calc(50% - 8px);
            height: 38px;
            padding: 0 10px;
            font: 600 12px 'Poppins', sans-serif;
            color: #fff;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }

        :is(#list-users, #list-filterUsers) button:hover { transform: translateY(-2px); }

        .btn-edit { background: var(--blue); }
        .btn-edit:hover { background: var(--blue-dark) !important; }
        .btn-active { background: var(--green); }
        .btn-active:hover { background: #1b5e20 !important; }
        .btn-disable { background: var(--gray); }
        .btn-disable:hover { background: #495057 !important; }
        .btn-delete { background: var(--red); }
        .btn-delete:hover { background: #a80000 !important; }

        /* Estado vazio */
        :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent):empty::before {
            content: "Nenhum usuário encontrado.";
            grid-column: 1 / -1;
            padding: 36px;
            text-align: center;
            font-size: 14px;
            color: #718096;
            background: var(--surface);
            border: 1px dashed #ccd6df;
            border-radius: 12px;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .list { padding: 20px 16px; }
            .welcome { padding: 24px 20px; }
            :is(#list-users, #list-filterUsers, #users-filters-old, #users-filters-recent) { grid-template-columns: 1fr; }
            :is(#list-users, #list-filterUsers) button { flex: 1 1 100%; }
            .btn-pdf { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="activeUser.html">Ativos</a>
        <a href="disableUser.html">Inativos</a>
        <a href="register.html">Novo Usuário</a>
    </nav>

    <section class="welcome">
        <span>Bem-vindo de volta</span>
        <h1 id="user-name">Carregando usuário...</h1>
    </section>

    <div class="metrics-grid">
        <div class="metric-card"><h3>Total de usuários</h3><p id="total-users">0</p></div>
        <div class="metric-card active-border"><h3>Ativos</h3><p id="active-users">0</p></div>
        <div class="metric-card inactive-border"><h3>Inativos</h3><p id="inactive-users">0</p></div>
        <div class="metric-card admin-border"><h3>Admins</h3><p id="admin-users">0</p></div>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Pesquisar por nome ou e-mail...">
    </div>

    <section class="list">
        <h2>Lista de Usuários</h2>
        <button onclick="createPdfUser()" class="btn-pdf">Baixar PDF de usuários</button>
        <div id="list-users"></div>
    </section>

    <section class="list">
        <h2>Novos cadastros (este mês)</h2>
        <div id="list-filterUsers"></div>
    </section>

    <section class="list">
        <div class="list-header">
            <h2>Usuários mais antigos</h2>
            <span>Antigos</span>
        </div>
        <div id="users-filters-old"></div>
    </section>

    <section class="list">
        <div class="list-header">
            <h2>Usuários mais recentes</h2>
            <span>Recentes</span>
        </div>
        <div id="users-filters-recent"></div>
    </section>

    <script src="../scriptAdm/scriptMe.js"></script>
    <script src="../scriptAdm/scriptList.js"></script>
    <script src="../scriptAdm/scriptTotal.js"></script>
    <script src="../scriptAdm/scriptFilterUsersMonth.js"></script>
    <script src="../scriptAdm/scriptFilter.js"></script>

</body>
</html>
